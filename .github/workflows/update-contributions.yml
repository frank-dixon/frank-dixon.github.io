name: Update contributions heatmap

on:
  schedule:
    # Weekly Sunday 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Persist so we can push to the same branch that triggered the run
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contributions SVG
        env:
          # Default GITHUB_TOKEN can read public contribution calendars via GraphQL
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-contributions-svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg
          if git diff --staged --quiet; then
            echo "No heatmap changes."
            exit 0
          fi
          git commit -m "chore: refresh GitHub contributions heatmap"
          git push
